<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano GamesBar</title>
<style>
  body{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px 60px;
    line-height: 1.5;
    color: #1c1c1c;
  }
  h1{ font-size: 22px; margin: 0 0 4px; }
  .stato{ color: #666; font-size: 14px; margin-bottom: 20px; }
  progress{ width: 100%; height: 8px; margin-bottom: 24px; }
  h2{
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin: 28px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #ddd;
  }
  h2 small{ float: right; color: #888; font-weight: normal; letter-spacing: 0; text-transform: none; }
  label{
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 5px 0;
    cursor: pointer;
  }
  label:hover{ background: #f6f6f6; }
  input{ margin-top: 4px; width: 16px; height: 16px; cursor: pointer; flex: none; }
  input:checked + span{ color: #999; text-decoration: line-through; }
  button{
    margin-top: 30px;
    padding: 7px 14px;
    font-size: 14px;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover{ background: #f0f0f0; }
</style>
</head>
<body>

<h1>Piano di lavoro — GamesBar</h1>
<p class="stato" id="stato"></p>
<progress id="barra" value="0" max="1"></progress>

<div id="lista"></div>

<button onclick="azzera()">Azzera tutto</button>

<script>
const PIANO = [
  ["1. Fondamenta backend", [
    "Creare progetto Maven/Spring Boot",
    "Creare GamesBarApp",
    "Configurare PostgreSQL",
    "Configurare Flyway",
    "Eseguire V1, V2 e V3",
    "Verificare database e migration"
  ]],
  ["2. Prima API REST", [
    "Capire JPA",
    "Mappare tipo_gioco con un'Entity",
    "Creare il Repository",
    "Creare il Service",
    "Creare il Controller",
    "Creare GET /api/tipi-gioco/attivi",
    "Provare l'API dal browser/Postman",
    "Creare il primo test"
  ]],
  ["3. Utenti e autenticazione", [
    "Entity e Repository di utente",
    "Registrazione email/password",
    "Hash della password",
    "Login",
    "Gestione ruoli e utenti bloccati",
    "Protezione degli endpoint"
  ]],
  ["4. Locali, giochi ed edge", [
    "Creazione e modifica dei locali",
    "Richieste di approvazione del locale",
    "Approvazione/rifiuto da parte dell'amministratore piattaforma",
    "Amministratore del gioco: tipi di gioco, sensori e regole",
    "Registrazione e autenticazione degli edge",
    "Heartbeat e stato online/offline",
    "Installazione dei giochi nei locali (codice univoco nel locale)",
    "Associazione gioco-edge",
    "Configurazione delle freccette",
    "Ricerca della freccettiera tramite codice_accesso"
  ]],
  ["5. Partite", [
    "Creazione della partita",
    "Partecipazioni individuali e ospiti",
    "Partecipazioni a squadre",
    "Avvio, sospensione, conclusione e annullamento",
    "Configurazione effettiva 301/501/701",
    "Registrazione degli eventi",
    "Registrazione dei tiri",
    "Calcolo del punteggio e del bust",
    "Salvataggio dei risultati",
    "Aggiornamento live con WebSocket o SSE"
  ]],
  ["6. MQTT e sincronizzazione offline", [
    "Definire i topic e i messaggi MQTT",
    "Aggiungere broker MQTT a Docker Compose",
    "Collegare il backend al broker",
    "Creare listener MQTT nel backend",
    "Autenticare l'edge",
    "Ricevere eventi dall'edge",
    "Impedire eventi e partite duplicate",
    "Gestire eventi arrivati dopo un periodo offline",
    "Aggiornare stato edge/sensori"
  ]],
  ["7. Edge e simulatore", [
    "Implementare il programma edge",
    "Creare database locale dell'edge",
    "Ricevere eventi dal simulatore",
    "Inviare eventi al backend tramite MQTT/REST",
    "Salvare localmente gli eventi quando il backend è offline",
    "Sincronizzarli alla riconnessione",
    "Implementare il simulatore della freccettiera",
    "Simulare punteggio, connessione e disconnessione",
    "Simulatore: mostrare lo stato degli attuatori (display del punteggio)",
    "Multithreading nell'edge e nel listener MQTT"
  ]],
  ["8. Frontend Vue.js + Tailwind CSS", [
    "Registrazione e login",
    "Giochi disponibili nei locali",
    "Partite giocate e statistiche personali",
    "Pagine amministratore piattaforma",
    "Pagine amministratore locale",
    "Pagine amministratore del gioco",
    "Gestione edge e giochi",
    "Inserimento codice della freccettiera",
    "Partita live"
  ]],
  ["9. Tornei e statistiche (obbligatori, versione semplice)", [
    "Gestione squadre e membri",
    "Creazione tornei (un tipo di gioco, più locali)",
    "Associazione torneo-locale",
    "Collegamento delle partite al torneo",
    "Classifica finale del torneo",
    "Statistiche: partite giocate, % vittorie, punteggi medi",
    "Statistiche: classifica giocatori e giochi più usati per locale",
    "Pagine frontend di tornei, classifiche e statistiche"
  ]],
  ["10. Documentazione (un pezzo alla fine di ogni fase)", [
    "UML dei casi d'uso + descrizione dei casi principali",
    "UML delle classi del dominio",
    "Diagramma dei package e delle classi di implementazione",
    "Diagrammi di sequenza dei flussi principali",
    "API REST in OpenAPI/Swagger (YAML)",
    "Schema dei microservizi con interfacce di ingresso/uscita",
    "Descrizione dei thread e della loro interazione"
  ]],
  ["11. Conclusione", [
    "Validazione e gestione errori",
    "Test di integrazione con scenari realistici",
    "Container Docker di backend, edge, simulatore e frontend",
    "Compose completo con tutti i servizi",
    "Preparazione demo (scenari di test)",
    "Relazione finale (6 capitoli)"
  ]],
  ["12. Facoltativi (solo se resta tempo)", [
    "Login con Google (OAuth 2.0)",
    "Interfaccia locale sul monitor dell'edge"
  ]]
];

// voci FINITE: vengono aggiornate alla fine di ogni passo, così le spunte sono salvate
// nel file e non solo nel browser. Si scrive il testo della voce (uguale a quello di PIANO),
// così le spunte restano giuste anche se l'ordine delle voci cambia
const FATTE_NEL_FILE = [
  // 1. Fondamenta backend
  "Creare progetto Maven/Spring Boot",
  "Creare GamesBarApp",
  "Configurare PostgreSQL",
  "Configurare Flyway",
  "Eseguire V1, V2 e V3",
  "Verificare database e migration",
  // 2. Prima API REST
  "Capire JPA",
  "Mappare tipo_gioco con un'Entity",
  "Creare il Repository",
  "Creare il Service",
  "Creare il Controller",
  "Creare GET /api/tipi-gioco/attivi",
  "Provare l'API dal browser/Postman",
  "Creare il primo test",
  // 3. Utenti e autenticazione
  "Entity e Repository di utente",
  "Registrazione email/password",
  "Hash della password",
  "Login",
  "Gestione ruoli e utenti bloccati",
  "Protezione degli endpoint",
  // 4. Locali, giochi ed edge
  "Creazione e modifica dei locali",
  "Richieste di approvazione del locale",
  "Approvazione/rifiuto da parte dell'amministratore piattaforma"
];

const CHIAVE = "piano-gamesbar";
let fatte = {};

// carica quello che era stato spuntato
try {
  fatte = JSON.parse(localStorage.getItem(CHIAVE)) || {};
} catch (e) {
  fatte = {};
}

function salva() {
  try {
    localStorage.setItem(CHIAVE, JSON.stringify(fatte));
  } catch (e) {
    // il salvataggio non funziona in anteprima, ma in locale sì
  }
}

// una voce è fatta se è scritta in FATTE_NEL_FILE oppure se l'hai spuntata tu nel browser
function eFatta(f, i) {
  const testo = PIANO[f][1][i];
  return FATTE_NEL_FILE.includes(testo) || fatte[f + "-" + i] === true;
}

function disegna() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  let totale = 0;
  let done = 0;

  PIANO.forEach(function (fase, f) {
    const titolo = fase[0];
    const voci = fase[1];

    let conteggio = 0;
    for (let i = 0; i < voci.length; i++) {
      if (eFatta(f, i)) {
        conteggio++;
      }
    }
    totale = totale + voci.length;
    done = done + conteggio;

    const h2 = document.createElement("h2");
    h2.innerHTML = titolo + " <small>" + conteggio + "/" + voci.length + "</small>";
    lista.appendChild(h2);

    voci.forEach(function (testo, i) {
      const chiave = f + "-" + i;
      const label = document.createElement("label");

      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = eFatta(f, i);
      // le voci segnate nel file non si possono togliere dal browser
      box.disabled = FATTE_NEL_FILE.includes(testo);
      box.onchange = function () {
        if (box.checked) fatte[chiave] = true;
        else delete fatte[chiave];
        salva();
        disegna();
      };

      const span = document.createElement("span");
      span.textContent = testo;

      label.appendChild(box);
      label.appendChild(span);
      lista.appendChild(label);
    });
  });

  document.getElementById("stato").textContent = done + " di " + totale + " completate";
  document.getElementById("barra").value = done;
  document.getElementById("barra").max = totale;
}

function azzera() {
  if (confirm("Togliere tutte le spunte?")) {
    fatte = {};
    salva();
    disegna();
  }
}

disegna();
</script>
</body>
</html>
